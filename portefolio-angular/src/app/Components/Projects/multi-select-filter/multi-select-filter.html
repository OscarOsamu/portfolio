<div class="multi-select" (focusout)="onFocusOut($event)">
  <button
    class="multi-select__trigger"
    type="button"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-controls]="id()"
    [attr.aria-label]="label()"
    (click)="isOpen.update(open => !open)">
    <span class="multi-select__value" [title]="selectedLabel()">{{ selectedLabel() }}</span>
    <span class="multi-select__chevron" aria-hidden="true"></span>
  </button>

  @if (isOpen()) {
    <div class="multi-select__panel" [id]="id()" role="group" [attr.aria-label]="label()">
      @for (option of options(); track option.value) {
        <label class="multi-select__option">
          <input
            type="checkbox"
            [checked]="selected().includes(option.value)"
            (change)="toggleOption(option.value, $event)" />
          <span>{{ option.label }}</span>
        </label>
      }
    </div>
  }
</div>
